<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 600;
      font-size: 20px;
      fill: #e0f2fe;
    }
    .mario-walker {
      animation: walkAcross 6s linear infinite;
    }
    @keyframes walkAcross {
      0% { transform: translateX(-60px); }
      100% { transform: translateX(860px); }
    }
  </style>

  <rect width="800" height="250" rx="12" fill="url(#bg-grad)"/>

  <g text-anchor="middle">
    <text x="400" y="105" class="title">Gustavo Araujo</text>
    <text x="400" y="145" class="subtitle">Desenvolvedor de Software</text>
  </g>

  <image class="mario-walker" href="https://raw.githubusercontent.com/GusAraujodev/PROJETO-MARIO/main/images/mario.gif" width="50" height="50" y="175" />
</svg>
